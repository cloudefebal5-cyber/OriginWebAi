function copyMessage(msgId) {
  const conv = getActiveConversation();
  if (!conv) return;
  const msg = conv.messages.find(m => m.id === msgId);
  if (!msg) return;
  const text = msg.content.replace(/<[^>]*>/g, '');
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard', 'success', 2000);
  });
}

function editMessage(msgId) {
  const conv = getActiveConversation();
  if (!conv) return;
  const idx = conv.messages.findIndex(m => m.id === msgId);
  if (idx === -1) return;
  const msg = conv.messages[idx];
  const plain = msg.content.replace(/<[^>]*>/g, '');

  openModal({
    title: 'Edit message',
    body: `<textarea class="form-textarea" id="editMsgInput" style="min-height:120px;">${escapeHtml(plain)}</textarea>`,
    footer: `
      <button class="btn btn-secondary" onclick="this.closest('.modal-overlay').querySelector('.modal-close').click()">Cancel</button>
      <button class="btn btn-primary" id="saveEditBtn">Save & Resend</button>
    `
  });

  setTimeout(() => {
    const input = $('#editMsgInput');
    if (input) {
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }
    const saveBtn = $('#saveEditBtn');
    if (saveBtn) {
      saveBtn.addEventListener('click', () => {
        const newText = $('#editMsgInput').value.trim();
        if (!newText) return;
        // Update the message
        msg.content = escapeHtml(newText).replace(/\n/g, '<br>');
        // Remove all messages after this one
        conv.messages = conv.messages.slice(0, idx + 1);
        conv.updatedAt = Date.now();
        saveConversations();
        renderChat();
        // Close modal
        document.querySelector('.modal-overlay .modal-close')?.click();
        // Regenerate response
        setTimeout(() => regenerateFrom(idx), 300);
      });
    }
  }, 100);
}

async function regenerateFrom(idx) {
  const conv = getActiveConversation();
  if (!conv) return;
  const lastUser = [...conv.messages].reverse().find(m => m.role === 'user');
  if (!lastUser) return;
  const prompt = lastUser.content.replace(/<[^>]*>/g, '');

  // Show typing
  const content = $('#chatContent');
  const typingEl = document.createElement('div');
  typingEl.className = 'message assistant';
  typingEl.innerHTML = `
    <div class="message-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
        <rect x="14" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="2" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="14" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.3"/>
      </svg>
    </div>
    <div class="message-body"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>
  `;
  content.appendChild(typingEl);
  scrollToBottom();

  const response = await AIEngine.generate(prompt, null);
  typingEl.remove();
  addMessage('assistant', response);
  scrollToBottom();
}

function regenerateMessage(msgId) {
  const conv = getActiveConversation();
  if (!conv) return;
  const idx = conv.messages.findIndex(m => m.id === msgId);
  if (idx === -1) return;
  // Remove this assistant message and everything after
  conv.messages = conv.messages.slice(0, idx);
  saveConversations();
  renderChat();
  regenerateFrom(idx - 1);
}

function handleFiles(files, isImage = false) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    const isImg = file.type.startsWith('image/');
    const attachment = {
      id: generateId('att_'),
      name: file.name,
      size: file.size,
      type: file.type,
      isImage: isImg || isImage,
      dataUrl: null
    };

    if (isImg || isImage) {
      reader.onload = (e) => {
        attachment.dataUrl = e.target.result;
        State.attachments.push(attachment);
        renderAttachments();
        updateSendButton();
      };
      reader.readAsDataURL(file);
    } else {
      State.attachments.push(attachment);
      renderAttachments();
      updateSendButton();
    }
  });
  showToast(files.length + ' file(s) attached', 'info', 2000);
}

function renderAttachments() {
  const container = $('#composerAttachments');
  if (State.attachments.length === 0) {
    container.innerHTML = '';
    return;
  }

  container.innerHTML = State.attachments.map(a => {
    if (a.isImage && a.dataUrl) {
      return `
        <div class="image-preview-chip" data-att-id="${a.id}">
          <img src="${a.dataUrl}" alt="${escapeHtml(a.name)}">
          <button class="remove-img" onclick="removeAttachment('${a.id}')" aria-label="Remove image">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      `;
    }
    return `
      <div class="attachment-chip">
        <div class="attachment-chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        </div>
        <span class="attachment-chip-name">${escapeHtml(a.name)}</span>
        <span class="attachment-chip-size">${formatFileSize(a.size)}</span>
        <button class="attachment-chip-remove" onclick="removeAttachment('${a.id}')" aria-label="Remove attachment">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    `;
  }).join('');
}

function removeAttachment(id) {
  State.attachments = State.attachments.filter(a => a.id !== id);
  renderAttachments();
  updateSendButton();
}

// ================================================================
function startVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('Voice input is not supported in this browser.', 'error');
    return;
  }

  if (State.recording && State.recognition) {
    State.recognition.stop();
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onstart = () => {
    State.recording = true;
    $('#micBtn').classList.add('recording');
    showToast('Listening...', 'info', 2000);
  };

  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    const ta = $('#composerTextarea');
    ta.value = transcript;
    autoResizeTextarea();
    updateSendButton();
  };

  recognition.onerror = (e) => {
    State.recording = false;
    $('#micBtn').classList.remove('recording');
    if (e.error === 'not-allowed') {
      showToast('Microphone access denied.', 'error');
    } else {
      showToast('Voice input error: ' + e.error, 'error');
    }
  };

  recognition.onend = () => {
    State.recording = false;
    $('#micBtn').classList.remove('recording');
  };

  recognition.start();
  State.recognition = recognition;
}

function openSearch() {
  const body = `
    <div class="search-input-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" placeholder="Search conversations, projects, messages..." autocomplete="off">
    </div>
    <div class="search-results" id="searchResults">
      <div class="search-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div>Type to search your conversations</div>
      </div>
    </div>
  `;

  const modal = openModal({
    title: 'Search',
    body,
    wide: true,
    onClose: () => {}
  });

  setTimeout(() => {
    const input = $('#searchInput');
    if (input) {
      input.focus();
      input.addEventListener('input', debounce((e) => {
        performSearch(e.target.value);
      }, 200));
    }
  }, 100);
}

function performSearch(query) {
  const results = $('#searchResults');
  if (!query.trim()) {
    results.innerHTML = `
      <div class="search-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div>Type to search your conversations</div>
      </div>`;
    return;
  }

  const q = query.toLowerCase();
  const matches = [];

  State.conversations.forEach(c => {
    const titleMatch = c.title.toLowerCase().includes(q);
    const msgMatch = c.messages.some(m => m.content.toLowerCase().includes(q));
    if (titleMatch || msgMatch) {
      let preview = '';
      if (msgMatch) {
        const msg = c.messages.find(m => m.content.toLowerCase().includes(q));
        preview = msg.content.replace(/<[^>]*>/g, '').slice(0, 80);
      } else {
        preview = c.messages.length + ' messages';
      }
      matches.push({ type: 'conversation', id: c.id, title: c.title, preview });
    }
  });

  State.projects.forEach(p => {
    if (p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q)) {
      matches.push({ type: 'project', id: p.id, title: p.name, preview: p.description || '' });
    }
  });

  if (matches.length === 0) {
    results.innerHTML = `
      <div class="search-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <div>No results found for "${escapeHtml(query)}"</div>
      </div>`;
    return;
  }

  results.innerHTML = matches.map(m => `
    <div class="search-result" data-result-type="${m.type}" data-result-id="${m.id}">
      <div class="search-result-icon">
        ${m.type === 'project'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>'}
      </div>
      <div class="search-result-info">
        <div class="search-result-title">${escapeHtml(m.title)}</div>
        <div class="search-result-preview">${escapeHtml(m.preview)}</div>
      </div>
    </div>
  `).join('');
}

function bindSettingsEvents(tab) {
  const content = $('#settingsContent');
  if (!content) return;

  // Toggles
  content.querySelectorAll('.form-toggle').forEach(t => {
    t.addEventListener('click', () => {
      const key = t.dataset.toggle;
      if (key) {
        State.settings[key] = !State.settings[key];
        t.classList.toggle('on');
        t.setAttribute('aria-checked', State.settings[key]);
        DB.save(DB.keys.settings, State.settings);
        showToast('Settings updated', 'success', 1500);
        if (key === 'showTimestamps') renderChat();
      }
    });
    t.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        t.click();
      }
    });
  });

  // Selects
  content.querySelectorAll('select[data-setting]').forEach(sel => {
    sel.addEventListener('change', () => {
      const key = sel.dataset.setting;
      State.settings[key] = sel.value;
      DB.save(DB.keys.settings, State.settings);
      showToast('Settings updated', 'success', 1500);
      if (key === 'defaultModel') {
        State.model = sel.value;
        DB.save(DB.keys.model, State.model);
        updateModelSelector();
      }
    });
  });

  // Theme options
  content.querySelectorAll('[data-theme-option]').forEach(btn => {
    btn.addEventListener('click', () => {
      const theme = btn.dataset.themeOption;
      applyTheme(theme);
      content.querySelectorAll('[data-theme-option]').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      showToast('Theme changed', 'success', 1500);
    });
  });
}

// 18. THEME MANAGEMENT
// ================================================================
function applyTheme(theme) {
  State.theme = theme;
  DB.save(DB.keys.theme, theme);

  if (theme === 'system') {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
  } else {
    document.documentElement.setAttribute('data-theme', theme);
  }
}

function initTheme() {
  const saved = DB.load(DB.keys.theme);
  if (saved) {
    State.theme = saved;
  }
  applyTheme(State.theme);

  // Listen for system changes
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (State.theme === 'system') applyTheme('system');
  });
}

function openModelSelector(anchor) {
  const existing = $('.dropdown');
  if (existing) existing.remove();

  const rect = anchor.getBoundingClientRect();
  const dd = document.createElement('div');
  dd.className = 'dropdown';
  dd.style.top = (rect.bottom + 6) + 'px';
  dd.style.left = Math.max(10, rect.left + rect.width / 2 - 150) + 'px';
  dd.style.width = '300px';

  dd.innerHTML = `
    <div class="dropdown-label">Select model</div>
    ${Object.values(MODELS).map(m => `
      <button class="model-option ${State.model === m.id ? 'selected' : ''}" data-model="${m.id}">
        <div class="model-option-radio"></div>

        </button>

          Export as Markdown
        </button>
      </div>
    `,
    narrow: true
  });
}

function exportConversation(convId, format) {
  const conv = State.conversations.find(c => c.id === convId);
  if (!conv) return;

  let content = '';
  let mime = 'text/plain';
  let ext = 'txt';

  if (format === 'json') {
    content = JSON.stringify(conv, null, 2);
    mime = 'application/json';
    ext = 'json';
  } else if (format === 'md') {
    content = `# ${conv.title}\n\n`;
    content += `*Exported ${new Date().toLocaleString()}*\n\n---\n\n`;
    conv.messages.forEach(m => {
      const role = m.role === 'user' ? 'You' : 'SquareAI';
      const text = m.content.replace(/<[^>]*>/g, '');
      content += `**${role}** (${formatTime(m.timestamp)}):\n\n${text}\n\n---\n\n`;
    });
    mime = 'text/markdown';
    ext = 'md';
  } else {
    content = `${conv.title}\nExported ${new Date().toLocaleString()}\n\n`;
    content += '='.repeat(50) + '\n\n';
    conv.messages.forEach(m => {
      const role = m.role === 'user' ? 'You' : 'SquareAI';
      const text = m.content.replace(/<[^>]*>/g, '');
      content += `[${role}] ${formatTime(m.timestamp)}\n${text}\n\n`;
    });
    mime = 'text/plain';
    ext = 'txt';
  }

  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${conv.title.replace(/[^a-z0-9]/gi, '_')}.${ext}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);

  showToast('Conversation exported', 'success', 2000);
  document.querySelector('.modal-overlay .modal-close')?.click();
}

function showFieldError(id, msg) {
  const el = $('#' + id);
  if (el) {
    el.textContent = msg;
    el.classList.remove('hidden');
    const input = el.previousElementSibling;
    if (input) input.classList.add('error');
  }
}

function clearFieldError(id) {
  const el = $('#' + id);
  if (el) {
    el.classList.add('hidden');
    const input = el.previousElementSibling;
    if (input) input.classList.remove('error');
  }
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function bindSignin() {
  const btn = $('#signinSubmitBtn');
  btn?.addEventListener('click', async () => {
    const email = $('#signinEmail').value.trim();
    const password = $('#signinPassword').value;
    let valid = true;

    clearFieldError('signinEmailError');
    clearFieldError('signinPasswordError');

    if (!email) { showFieldError('signinEmailError', 'Email is required'); valid = false; }
    else if (!validateEmail(email)) { showFieldError('signinEmailError', 'Please enter a valid email'); valid = false; }

    if (!password) { showFieldError('signinPasswordError', 'Password is required'); valid = false; }
    else if (password.length < 6) { showFieldError('signinPasswordError', 'Password must be at least 6 characters'); valid = false; }

    if (!valid) return;

    try {
      await Auth.signIn({ email, password });
      showToast('Welcome back!', 'success', 2000);
    } catch (error) {
      showFieldError('signinPasswordError', error.message || 'Sign in failed.');
    }
  });
}

function bindSignup() {
  const btn = $('#signupSubmitBtn');
  btn?.addEventListener('click', async () => {
    const name = $('#signupName').value.trim();
    const email = $('#signupEmail').value.trim();
    const password = $('#signupPassword').value;
    const confirm = $('#signupConfirm').value;
    let valid = true;

    ['signupNameError','signupEmailError','signupPasswordError','signupConfirmError'].forEach(clearFieldError);

    if (!name) { showFieldError('signupNameError', 'Full name is required'); valid = false; }
    if (!email) { showFieldError('signupEmailError', 'Email is required'); valid = false; }
    else if (!validateEmail(email)) { showFieldError('signupEmailError', 'Please enter a valid email'); valid = false; }
    if (!password) { showFieldError('signupPasswordError', 'Password is required'); valid = false; }
    else if (password.length < 6) { showFieldError('signupPasswordError', 'Password must be at least 6 characters'); valid = false; }
    if (password !== confirm) { showFieldError('signupConfirmError', 'Passwords do not match'); valid = false; }

    if (!valid) return;

    try {
      const result = await Auth.signUp({ name, email, password });
      if (result.session) {
        showToast('Account created! Welcome to SquareAI.', 'success', 2500);
      } else {
        showToast('Check your email to confirm your account.', 'info', 3500);
        renderAuth('signin');
      }
    } catch (error) {
      showFieldError('signupPasswordError', error.message || 'Account creation failed.');
    }
  });
}

async function signInOAuth(provider) {
  try {
    await Auth.signInWithOAuth(provider);
  } catch (error) {
    showToast(error.message || 'Social sign in failed.', 'error');
  }
}

function bindForgot() {
  const btn = $('#forgotSubmitBtn');
  btn?.addEventListener('click', async () => {
    const email = $('#forgotEmail').value.trim();
    clearFieldError('forgotEmailError');
    if (!email || !validateEmail(email)) {
      showFieldError('forgotEmailError', 'Please enter a valid email');
      return;
    }
    if (!supabaseClient) {
      showToast('Supabase is not configured.', 'error');
      return;
    }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    if (error) showFieldError('forgotEmailError', error.message);
    else showToast('Password reset email sent.', 'success', 2500);
  });
}

document.addEventListener('keydown', (e) => {
  const mod = e.ctrlKey || e.metaKey;

  if (mod && e.key === 'k') {
    e.preventDefault();
    openSearch();
  }

  if (mod && e.key === 'n') {
    e.preventDefault();
    createConversation();
  }

  if (mod && e.key === '/') {
    e.preventDefault();
    focusInput();
  }

  // Escape closes dropdowns
  if (e.key === 'Escape') {
    document.querySelectorAll('.dropdown').forEach(d => d.remove());
  }
});

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Help
      </button>
      <div class="dropdown-divider"></div>
      <button class="dropdown-item danger" onclick="confirmSignOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    `;
    document.body.appendChild(dd);
    setTimeout(() => {
      document.addEventListener('click', function closeDd(ev) {
        if (!dd.contains(ev.target) && ev.target !== e.currentTarget) {
          dd.remove();
          document.removeEventListener('click', closeDd);
        }
      });
    }, 0);
  });

  // Model selector
  $('#modelSelectorBtn')?.addEventListener('click', (e) => {
    openModelSelector(e.currentTarget);
  });

  // Share
  $('#shareBtn')?.addEventListener('click', openShareModal);

  // More menu
  $('#moreMenuBtn')?.addEventListener('click', (e) => {
    const existing = $('.dropdown');
    if (existing) existing.remove();
    const rect = e.currentTarget.getBoundingClientRect();
    const dd = document.createElement('div');
    dd.className = 'dropdown';
    dd.style.position = 'fixed';
    dd.style.top = (rect.bottom + 4) + 'px';
    dd.style.right = (window.innerWidth - rect.right) + 'px';
    dd.innerHTML = `
      <button class="dropdown-item" onclick="openExportModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export conversation
      </button>
      <button class="dropdown-item" onclick="showHelp()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        Help center
      </button>
      <button class="dropdown-item" onclick="openSettings('general')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        Settings
      </button>
    `;
    document.body.appendChild(dd);
    setTimeout(() => {
      document.addEventListener('click', function closeDd(ev) {
        if (!dd.contains(ev.target) && ev.target !== e.currentTarget) {
          dd.remove();
          document.removeEventListener('click', closeDd);
        }
      });
    }, 0);
  });

  // Topbar avatar
  $('#topbarAvatar')?.addEventListener('click', () => $('#userMenuBtn')?.click());

  // New project
  $('#newProjectBtn')?.addEventListener('click', createProject);

  // Composer textarea
  const ta = $('#composerTextarea');
  ta?.addEventListener('input', () => {
    autoResizeTextarea();
    updateSendButton();
  });

  ta?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && State.settings.enterToSend) {
      e.preventDefault();
      if (!$('#sendBtn').disabled) sendMessage();
    }
  });

  // Send button
  $('#sendBtn')?.addEventListener('click', sendMessage);

  // Attach buttons
  $('#attachBtn')?.addEventListener('click', () => $('#fileInput').click());
  $('#imageBtn')?.addEventListener('click', () => $('#imageInput').click());

  $('#fileInput')?.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files);
    e.target.value = '';
  });

  $('#imageInput')?.addEventListener('change', (e) => {
    if (e.target.files.length) handleFiles(e.target.files, true);
    e.target.value = '';
  });

  // Mic
  $('#micBtn')?.addEventListener('click', startVoiceInput);

  // Suggestion cards (event delegation on chat content)
  $('#chatContent')?.addEventListener('click', (e) => {
    const card = e.target.closest('.suggestion-card');
    if (card) {
      const prompt = card.dataset.prompt;
      if (prompt) {
        $('#composerTextarea').value = prompt;
        autoResizeTextarea();
        updateSendButton();
        sendMessage();
      }
    }
  });

  // Conversation items (event delegation on sidebar nav)
  $('#sidebarNav')?.addEventListener('click', (e) => {
    const menuBtn = e.target.closest('[data-conv-menu]');
    if (menuBtn) {
      e.stopPropagation();
      openConvMenu(menuBtn.dataset.convMenu, menuBtn);
      return;
    }

    const convItem = e.target.closest('[data-conv-id]');
    if (convItem) {
      const id = convItem.dataset.convId;
      State.activeConversationId = id;
      State.view = 'chat';
      renderSidebar();
      renderChat();
      if (window.innerWidth <= 1024) {
        $('#sidebar').classList.remove('open');
        document.querySelector('.sidebar-overlay')?.remove();
      }
    }

    const projItem = e.target.closest('[data-project-id]');
    if (projItem) {
      // Project click - for now, just toast (full project view can be extended)
      showToast('Project view coming soon', 'info', 2000);
    }
  });

  // Sidebar collapse
  $('#sidebarCollapseBtn')?.addEventListener('click', () => {
    State.sidebarCollapsed = !State.sidebarCollapsed;
    $('#sidebar').classList.toggle('collapsed', State.sidebarCollapsed);
    DB.save(DB.keys.sidebarCollapsed, State.sidebarCollapsed);
  });

  // Mobile menu
  $('#mobileMenuBtn')?.addEventListener('click', () => {
    const sidebar = $('#sidebar');
    const isOpen = sidebar.classList.toggle('open');
    if (isOpen) {
      const overlay = document.createElement('div');
      overlay.className = 'sidebar-overlay';
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('open');
        overlay.remove();
      });
      document.body.appendChild(overlay);
    } else {
      document.querySelector('.sidebar-overlay')?.remove();
    }
  });

  // Search result clicks (event delegation)
  document.addEventListener('click', (e) => {
    const result = e.target.closest('.search-result');
    if (result) {
      const type = result.dataset.resultType;
      const id = result.dataset.resultId;
      if (type === 'conversation') {
        State.activeConversationId = id;
        State.view = 'chat';
        renderSidebar();
        renderChat();
        document.querySelector('.modal-overlay .modal-close')?.click();
      } else if (type === 'project') {
        showToast('Project view coming soon', 'info', 2000);
      }
    }
  });
}

// ================================================================
// 32. INITIALIZATION
// ================================================================
function showApp() {
  $('#authScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  renderSidebar();
  renderChat();
  updateModelSelector();
  focusInput();
}

async function applySupabaseSession(session) {
  if (!session) {
    State.session = null;
    State.user = null;
    State.conversations = [];
    State.activeConversationId = null;
    showAuthScreen();
    return;
  }
  if (State.user && State.session?.access_token === session.access_token) return;

  State.session = session;
  State.user = {
    id: session.user.id,
    name: session.user.user_metadata?.name || session.user.user_metadata?.full_name || session.user.email.split('@')[0],
    email: session.user.email,
    createdAt: session.user.created_at,
    plan: 'free'
  };
  State.conversations = DB.load(conversationStorageKey(), []);
  try {
    const { data: profile } = await supabaseClient.from('profiles')
      .select('name, created_at').eq('id', State.user.id).maybeSingle();
    if (profile?.name) State.user.name = profile.name;
    await loadConversationsFromDB();
  } catch (error) {
    console.error('Could not load saved chats:', error);
    showToast(error.message || 'Saved chats could not be loaded.', 'error');
  }
  showApp();
}

async function init() {
  // Load state
  State.user = null;
  State.session = null;
  State.conversations = [];
  State.projects = DB.load(DB.keys.projects, []);
  State.settings = Object.assign(State.settings, DB.load(DB.keys.settings, {}));
  State.model = DB.load(DB.keys.model, 'smart');
  State.sidebarCollapsed = DB.load(DB.keys.sidebarCollapsed, false);

  // Apply theme
  initTheme();

  // Apply sidebar collapsed state
  if (State.sidebarCollapsed) {
    $('#sidebar')?.classList.add('collapsed');
  }

  // Bind events
  bindEvents();

  if (!supabaseClient) {
    showAuthScreen();
    showToast('Supabase failed to load. Check the public configuration and network.', 'error');
    return;
  }
  supabaseClient.auth.onAuthStateChange((_event, session) => {
    Promise.resolve().then(() => applySupabaseSession(session)).catch(error => {
      console.error('Auth state update failed:', error);
      showToast(error.message || 'Account state could not be loaded.', 'error');
    });
  });
  const { data, error } = await supabaseClient.auth.getSession();
  if (error) showToast(error.message || 'Could not restore your session.', 'error');
  await applySupabaseSession(data?.session || null);

  // Welcome message
  console.log('%cSquareAI v1.0', 'font-size:18px;font-weight:bold;color:#2e6b4e;');
  console.log('%cThink. Create. Build.', 'font-size:13px;color:#5f5e5b;');
}

// Start the app
document.addEventListener('DOMContentLoaded', init);

/* ================================================================
   INTEGRATION NOTES
   ================================================================

   1. How the frontend works:
      - The app is a single-page application (SPA) built with vanilla
        JavaScript. It uses a simple state object (State) and renders
        the UI based on that state.
      - The sidebar, chat area, modals, and settings are all rendered
        dynamically via JavaScript DOM manipulation.
      - localStorage is used as a persistent database for conversations,
        projects, settings, and demo authentication.

   2. How conversations are stored:
      - Conversations are stored in localStorage under the key
        'squareai_conversations' as a JSON array of conversation objects.
      - Each conversation has: id, title, createdAt, updatedAt, starred,
        archived, and messages[].
      - Each message has: id, role, content, timestamp, attachments[].
      - The DB helper (DB.load, DB.save, DB.update) handles serialization
        and error recovery for corrupted data.

   3. How authentication currently works:
      - Demo authentication is implemented in the Auth object.
      - Sign up creates a user object and saves it to 'squareai_user'.
      - Sign in either retrieves an existing user or creates a demo user.
      - A session token is stored in 'squareai_session'.
      - On page load, init() checks for a valid session and shows the
        app or the auth screen accordingly.
      - This is NOT secure for production — see integration notes below.

   4. How to connect Supabase:
      - Replace the DB object with Supabase client calls.
      - Replace Auth.signIn / Auth.signUp with supabase.auth.signInWithPassword
        and supabase.auth.signUp.
      - Use Supabase Storage for file uploads (replace handleFiles with
        supabase.storage.from('files').upload()).
      - Use Supabase tables for conversations, messages, and projects.
      - Add a supabase-js script tag or use a bundler.

   5. Where to connect a real AI API:
      - The AIEngine.generate() function is the single integration point.
      - Replace the mock logic with a fetch() call to your backend or
        AI provider (OpenAI, Anthropic, Gemini, etc.).
      - IMPORTANT: Never expose API keys in frontend JavaScript.
        Always route AI requests through a secure backend (e.g., a
        Supabase Edge Function, Vercel API route, or your own server).
      - Example:
          async generate(prompt) {
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prompt, model: State.model })
            });
            return (await res.json()).content;
          }

   6. Which parts are demo-only:
      - Authentication: localStorage-based, not secure.
      - AI responses: keyword-based mock engine, not real AI.
      - Share links: local identifiers, no server upload.
      - File uploads: stored as metadata in memory, not persisted.
      - Usage dashboard: computed from local data, not real API usage.
      - Voice input: uses browser SpeechRecognition where available.
      - All data is stored locally and never sent to a server.

   ================================================================ */
</script>
