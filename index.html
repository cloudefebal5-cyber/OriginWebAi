  <style>
    /* ============================================================
       SQUAREAI v1.0 — DESIGN SYSTEM & GLOBAL STYLES
       ============================================================ */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Light theme (default) */
      --bg: #f7f6f3;
      --surface: #ffffff;
      --surface-secondary: #f0efeb;
      --text-primary: #1e1d1a;
      --text-secondary: #e9e5da;
      --text-muted: #8b8a87;
      --border: #e3e2de;
      --border-strong: #d1cfc9;
      --accent: #2e6b4e;
      --accent-hover: #245a40;
      --accent-soft: #e8f0ea;
      --danger: #b33a3a;
      --success: #2e6b4e;
      --warning: #b87c2c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.10);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --transition: 180ms cubic-bezier(0.22, 1, 0.36, 1);
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
      --sidebar-width: 280px;
      --sidebar-collapsed-width: 68px;
      --topbar-height: 60px;
    }

    [data-theme="dark"] {
      --bg: #1a1a18;
      --surface: #232321;
      --surface-secondary: #2c2c29;
      --text-primary: #f0efeb;
      --text-secondary: #b5b3ad;
      --text-muted: #85837c;
      --border: #353531;
      --border-strong: #454540;
      --accent: #4a9b6f;
      --accent-hover: #5aae80;
      --accent-soft: #1f3328;
      --danger: #d65a5a;
      --success: #4a9b6f;
      --warning: #d6a24a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.3);
      --shadow-lg: 0 12px 32px rgba(0,0,0,0.4);
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }

    a { color: var(--accent); text-decoration: none; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ============================================================
       APP SHELL
       ============================================================ */
    .app {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    /* ============================================================
       SIDEBAR
       ============================================================ */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      height: 100vh;
      background: var(--surface-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: width var(--transition), min-width var(--transition), transform var(--transition);
      z-index: 40;
      position: relative;
    }

    .sidebar.collapsed {
      width: var(--sidebar-collapsed-width);
      min-width: var(--sidebar-collapsed-width);
    }

    .sidebar.collapsed .sidebar-label,
    .sidebar.collapsed .sidebar-section-title,
    .sidebar.collapsed .conv-item-text,
    .sidebar.collapsed .conv-item-menu,
    .sidebar.collapsed .project-item-text,
    .sidebar.collapsed .user-info,
    .sidebar.collapsed .new-chat-text {
      display: none;
    }

    .sidebar.collapsed .sidebar-header {
      justify-content: center;
      padding: 16px 0;
    }

    .sidebar.collapsed .new-chat-btn {
      justify-content: center;
      padding: 10px;
      margin: 8px;
    }

    .sidebar.collapsed .sidebar-nav {
      align-items: center;
    }

    .sidebar.collapsed .sidebar-nav-item {
      justify-content: center;
      padding: 10px;
      margin: 2px 8px;
    }

    .sidebar.collapsed .conv-item {
      justify-content: center;
      padding: 8px;
    }

    .sidebar.collapsed .project-item {
      justify-content: center;
      padding: 8px;
    }

    .sidebar.collapsed .sidebar-footer {
      align-items: center;
    }

    .sidebar.collapsed .user-avatar-btn {
      margin: 0 auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 8px;
      flex-shrink: 0;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg {
      width: 100%;
      height: 100%;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 8px 12px 4px;
      padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      transition: all var(--transition);
      width: calc(100% - 24px);
      text-align: left;
    }

    .new-chat-btn:hover {
      background: var(--surface);
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
    }

    .new-chat-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--accent);
    }

    .sidebar-search-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 12px 8px;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      color: var(--text-secondary);
      transition: all var(--transition);
      width: calc(100% - 24px);
      text-align: left;
    }

    .sidebar-search-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .sidebar-search-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .sidebar-search-btn kbd {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-sans);
    }

    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 0 8px;
    }

    .sidebar-section {
      margin-top: 12px;
    }

    .sidebar-section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }

    .sidebar-section-title button {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .sidebar-section-title button:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .sidebar-section-title button svg {
      width: 14px;
      height: 14px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      margin: 1px 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
      position: relative;
      min-height: 36px;
    }

    .conv-item:hover {
      background: var(--surface);
    }

    .conv-item.active {
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .conv-item.active .conv-item-text {
      font-weight: 500;
      color: var(--text-primary);
    }

    .conv-item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .conv-item-icon svg {
      width: 16px;
      height: 16px;
    }

    .conv-item-text {
      flex: 1;
      font-size: 13.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }

    .conv-item-menu {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--text-muted);
      opacity: 0;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .conv-item:hover .conv-item-menu {
      opacity: 1;
    }

    .conv-item-menu:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .conv-item-menu svg {
      width: 15px;
      height: 15px;
    }

    .project-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      margin: 1px 6px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
    }

    .project-item:hover {
      background: var(--surface);
    }

    .project-item.active {
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .project-item-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .project-item-icon svg {
      width: 16px;
      height: 16px;
    }

    .project-item-text {
      flex: 1;
      font-size: 13.5px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-sidebar {
      padding: 20px 16px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .sidebar-footer {
      flex-shrink: 0;
      padding: 8px 12px 12px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sidebar-footer-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--text-secondary);
      transition: all var(--transition);
      width: 100%;
      text-align: left;
    }

    .sidebar-footer-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .sidebar-footer-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .user-avatar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      transition: all var(--transition);
      width: 100%;
      text-align: left;
    }

    .user-avatar-btn:hover {
      background: var(--surface);
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
      letter-spacing: 0.02em;
    }

    .user-info {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-plan {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ============================================================
       MAIN AREA
       ============================================================ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      min-width: 0;
      background: var(--bg);
      position: relative;
    }

    .topbar {
      height: var(--topbar-height);
      min-height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      gap: 12px;
      z-index: 20;
    }

    .mobile-menu-btn {
      display: none;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      transition: all var(--transition);
    }

    .mobile-menu-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .mobile-menu-btn svg {
      width: 20px;
      height: 20px;
    }

    .topbar-title {
      font-size: 14.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 300px;
      color: var(--text-primary);
    }

    .topbar-center {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .model-selector-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      transition: all var(--transition);
    }

    .model-selector-btn:hover {
      border-color: var(--border-strong);
      box-shadow: var(--shadow-sm);
    }

    .model-selector-btn svg {
      width: 14px;
      height: 14px;
      color: var(--text-muted);
    }

    .model-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .topbar-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      transition: all var(--transition);
    }

    .topbar-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .topbar-btn svg {
      width: 18px;
      height: 18px;
    }

    .topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .topbar-avatar:hover {
      opacity: 0.9;
      transform: scale(1.04);
    }

    /* ============================================================
       CHAT AREA
       ============================================================ */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      scroll-behavior: smooth;
    }

    .chat-content {
      max-width: 780px;
      margin: 0 auto;
      padding: 24px 24px 120px;
      min-height: 100%;
    }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 24px 40px;
      animation: fadeInUp 0.5s ease;
    }

    .welcome-logo {
      width: 56px;
      height: 56px;
      margin-bottom: 20px;
    }

    .welcome-title {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin-bottom: 10px;
      color: var(--text-primary);
    }

    .welcome-subtitle {
      font-size: 15px;
      color: var(--text-secondary);
      margin-bottom: 36px;
      max-width: 420px;
      line-height: 1.5;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 580px;
    }

    .suggestion-card {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      text-align: left;
      transition: all var(--transition);
      cursor: pointer;
    }

    .suggestion-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .suggestion-card-icon {
      width: 20px;
      height: 20px;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .suggestion-card-icon svg {
      width: 100%;
      height: 100%;
    }

    .suggestion-card-title {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .suggestion-card-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Messages */
    .message {
      display: flex;
      gap: 14px;
      margin-bottom: 28px;
      animation: messageIn 0.3s ease;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    .message.assistant .message-avatar {
      background: var(--accent);
      color: white;
    }

    .message.user .message-avatar {
      background: var(--surface-secondary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }

    .message-body {
      flex: 1;
      min-width: 0;
      max-width: 100%;
    }

    .message.user .message-body {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .message-content {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text-primary);
      word-wrap: break-word;
    }

    .message.user .message-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
      padding: 12px 16px;
      display: inline-block;
      max-width: 100%;
    }

    .message.assistant .message-content {
      padding: 0;
    }

    .message-content p {
      margin-bottom: 12px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content h1, .message-content h2, .message-content h3 {
      margin: 20px 0 10px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .message-content h1 { font-size: 20px; }
    .message-content h2 { font-size: 17px; }
    .message-content h3 { font-size: 15.5px; }

    .message-content ul, .message-content ol {
      margin: 10px 0;
      padding-left: 22px;
    }

    .message-content li {
      margin-bottom: 5px;
      line-height: 1.6;
    }

    .message-content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 14px;
      margin: 12px 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    .message-content code {
      font-family: var(--font-mono);
      font-size: 13px;
      background: var(--surface-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .message-content pre {
      background: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
      position: relative;
    }

    .message-content pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 13px;
      line-height: 1.55;
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .code-lang {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
    }

    .code-copy-btn {
      font-size: 11.5px;
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 4px;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .code-copy-btn:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .code-copy-btn svg {
      width: 12px;
      height: 12px;
    }

    .message-content table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
    }

    .message-content th, .message-content td {
      border: 1px solid var(--border);
      padding: 8px 12px;
      text-align: left;
    }

    .message-content th {
      background: var(--surface-secondary);
      font-weight: 600;
    }

    /* Message actions */
    .message-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-top: 8px;
      opacity: 0;
      transition: opacity var(--transition);
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .msg-action-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .msg-action-btn:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .msg-action-btn.active {
      color: var(--accent);
    }

    .msg-action-btn svg {
      width: 14px;
      height: 14px;
    }

    .msg-timestamp {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 6px;
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 10px 0;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }

    /* ============================================================
       COMPOSER
       ============================================================ */
    .composer-wrap {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0 24px 20px;
      background: linear-gradient(to top, var(--bg) 60%, transparent);
      pointer-events: none;
    }

    .composer {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
      transition: border-color var(--transition), box-shadow var(--transition);
      pointer-events: auto;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: var(--shadow-lg);
    }

    .composer-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px 0;
    }

    .attachment-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      animation: fadeIn 0.2s ease;
    }

    .attachment-chip-icon {
      width: 16px;
      height: 16px;
      color: var(--accent);
      flex-shrink: 0;
    }

    .attachment-chip-icon svg {
      width: 100%;
      height: 100%;
    }

    .attachment-chip-name {
      max-width: 140px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-primary);
    }

    .attachment-chip-size {
      font-size: 11px;
      color: var(--text-muted);
    }

    .attachment-chip-remove {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      color: var(--text-muted);
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .attachment-chip-remove:hover {
      background: var(--border);
      color: var(--danger);
    }

    .attachment-chip-remove svg {
      width: 12px;
      height: 12px;
    }

    .image-preview-chip {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--border);
      animation: fadeIn 0.2s ease;
    }

    .image-preview-chip img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-preview-chip .remove-img {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
    }

    .image-preview-chip .remove-img svg {
      width: 10px;
      height: 10px;
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 10px 16px;
    }

    .composer-textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-size: 15px;
      line-height: 1.5;
      max-height: 200px;
      min-height: 24px;
      padding: 6px 0;
      color: var(--text-primary);
    }

    .composer-textarea::placeholder {
      color: var(--text-muted);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .composer-btn {
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: var(--text-secondary);
      transition: all var(--transition);
    }

    .composer-btn:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .composer-btn.recording {
      background: var(--danger);
      color: white;
      animation: pulse 1.5s infinite;
    }

    .composer-btn svg {
      width: 18px;
      height: 18px;
    }

    .send-btn {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .send-btn svg {
      width: 18px;
      height: 18px;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px 8px;
    }

    .char-count {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .char-count.warning {
      color: var(--warning);
    }

    .composer-hint {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* ============================================================
       MODAL SYSTEM
       ============================================================ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      animation: modalIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .modal.wide { max-width: 680px; }
    .modal.narrow { max-width: 380px; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      transition: all var(--transition);
    }

    .modal-close:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .modal-close svg {
      width: 18px;
      height: 18px;
    }

    .modal-body {
      padding: 20px 22px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      padding: 14px 22px 18px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 500;
      transition: all var(--transition);
      white-space: nowrap;
      line-height: 1.4;
    }

    .btn svg {
      width: 16px;
      height: 16px;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface-secondary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: var(--surface);
      border-color: var(--border-strong);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      opacity: 0.9;
    }

    .btn-ghost {
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .btn-block {
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Form elements */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .form-input, .form-textarea, .form-select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      font-size: 14px;
      color: var(--text-primary);
      transition: all var(--transition);
      outline: none;
    }

    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-input.error {
      border-color: var(--danger);
    }

    .form-error {
      font-size: 12px;
      color: var(--danger);
      margin-top: 4px;
    }

    .form-hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row > * { flex: 1; }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 13.5px;
    }

    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .form-toggle {
      position: relative;
      width: 40px;
      height: 22px;
      background: var(--border-strong);
      border-radius: 11px;
      cursor: pointer;
      transition: background var(--transition);
      flex-shrink: 0;
    }

    .form-toggle.on {
      background: var(--accent);
    }

    .form-toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: white;
      transition: transform var(--transition);
    }

    .form-toggle.on::after {
      transform: translateX(18px);
    }

    /* ============================================================
       DROPDOWN
       ============================================================ */
    .dropdown {
      position: absolute;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      min-width: 200px;
      padding: 6px;
      z-index: 60;
      animation: dropdownIn 0.18s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--text-primary);
      transition: background var(--transition);
      text-align: left;
    }

    .dropdown-item:hover {
      background: var(--surface-secondary);
    }

    .dropdown-item.danger {
      color: var(--danger);
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .dropdown-item.danger svg { color: var(--danger); }

    .dropdown-divider {
      height: 1px;
      background: var(--border);
      margin: 4px 8px;
    }

    .dropdown-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      padding: 8px 12px 4px;
    }

    /* Model dropdown */
    .model-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      transition: background var(--transition);
      text-align: left;
    }

    .model-option:hover {
      background: var(--surface-secondary);
    }

    .model-option.selected {
      background: var(--accent-soft);
    }

    .model-option-radio {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--border-strong);
      flex-shrink: 0;
      margin-top: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }

    .model-option.selected .model-option-radio {
      border-color: var(--accent);
    }

    .model-option.selected .model-option-radio::after {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .model-option-info { flex: 1; }

    .model-option-name {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .model-option-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }

    .model-speed {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--surface-secondary);
      color: var(--text-muted);
      font-weight: 500;
    }

    /* ============================================================
       TOAST NOTIFICATIONS
       ============================================================ */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      font-size: 13.5px;
      color: var(--text-primary);
      animation: toastIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: auto;
      max-width: 340px;
    }

    .toast.removing {
      animation: toastOut 0.25s ease forwards;
    }

    .toast-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon { color: var(--success); }
    .toast.error .toast-icon { color: var(--danger); }
    .toast.info .toast-icon { color: var(--accent); }

    /* ============================================================
       SEARCH MODAL
       ============================================================ */
    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    .search-input-wrap svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 15px;
      color: var(--text-primary);
    }

    .search-results {
      max-height: 400px;
      overflow-y: auto;
      padding: 8px;
    }

    .search-result {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--transition);
    }

    .search-result:hover {
      background: var(--surface-secondary);
    }

    .search-result-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--surface-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--accent);
    }

    .search-result-icon svg {
      width: 16px;
      height: 16px;
    }

    .search-result-info { flex: 1; min-width: 0; }

    .search-result-title {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-result-preview {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .search-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13.5px;
    }

    .search-empty svg {
      width: 32px;
      height: 32px;
      margin-bottom: 10px;
      opacity: 0.4;
    }

    /* ============================================================
       SETTINGS PANEL
       ============================================================ */
    .settings-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 80;
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .settings-sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--surface-secondary);
      border-right: 1px solid var(--border);
      padding: 16px 10px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .settings-sidebar-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px 18px;
    }

    .settings-sidebar-header svg {
      width: 20px;
      height: 20px;
      color: var(--accent);
    }

    .settings-sidebar-header span {
      font-size: 15px;
      font-weight: 600;
    }

    .settings-nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--text-secondary);
      transition: all var(--transition);
      width: 100%;
      text-align: left;
    }

    .settings-nav-item:hover {
      background: var(--surface);
      color: var(--text-primary);
    }

    .settings-nav-item.active {
      background: var(--surface);
      color: var(--text-primary);
      font-weight: 500;
      box-shadow: var(--shadow-sm);
    }

    .settings-nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    .settings-content {
      flex: 1;
      overflow-y: auto;
      padding: 32px 40px;
    }

    .settings-panel {
      max-width: 620px;
      animation: fadeIn 0.25s ease;
    }

    .settings-panel h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .settings-panel-desc {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .settings-group {
      margin-bottom: 28px;
    }

    .settings-group-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: none;
    }

    .setting-info { flex: 1; }

    .setting-label {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 2px;
    }

    .setting-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .setting-control {
      flex-shrink: 0;
    }

    .theme-options {
      display: flex;
      gap: 8px;
    }

    .theme-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      color: var(--text-secondary);
      transition: all var(--transition);
      min-width: 80px;
    }

    .theme-option:hover {
      border-color: var(--border-strong);
    }

    .theme-option.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--text-primary);
    }

    .theme-option svg {
      width: 20px;
      height: 20px;
    }

    .theme-preview {
      width: 100%;
      height: 40px;
      border-radius: 6px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
    }

    .theme-preview.light { background: #f7f6f3; }
    .theme-preview.dark { background: #1a1a18; }
    .theme-preview.system { background: linear-gradient(135deg, #f7f6f3 50%, #1a1a18 50%); }

    /* Keyboard shortcuts */
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .shortcut-row:last-child { border-bottom: none; }

    .shortcut-keys {
      display: flex;
      gap: 4px;
    }

    .shortcut-key {
      padding: 3px 8px;
      border-radius: 5px;
      background: var(--surface-secondary);
      border: 1px solid var(--border);
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--text-secondary);
      min-width: 24px;
      text-align: center;
    }

    /* About page */
    .about-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }

    .about-logo svg {
      width: 40px;
      height: 40px;
    }

    .about-logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .about-version {
      display: inline-block;
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 16px;
    }

    .about-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      transition: color var(--transition);
    }

    .about-link:hover { color: var(--accent); }

    .about-link svg {
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    /* ============================================================
       USAGE DASHBOARD
       ============================================================ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .stat-card {
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      transition: all var(--transition);
    }

    .stat-card:hover {
      box-shadow: var(--shadow-sm);
      transform: translateY(-1px);
    }

    .stat-icon {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--accent);
    }

    .stat-icon svg { width: 17px; height: 17px; }

    .stat-value {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .stat-label {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ============================================================
       AUTH SCREENS
       ============================================================ */
    .auth-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
      animation: modalIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .auth-logo svg {
      width: 36px;
      height: 36px;
    }

    .auth-logo-text {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .auth-title {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 6px;
    }

    .auth-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-primary);
      transition: all var(--transition);
      margin-bottom: 8px;
    }

    .social-btn:hover {
      background: var(--surface-secondary);
      border-color: var(--border-strong);
    }

    .social-btn svg {
      width: 18px;
      height: 18px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .auth-footer a {
      color: var(--accent);
      font-weight: 500;
      cursor: pointer;
    }

    .auth-footer a:hover { text-decoration: underline; }

    /* ============================================================
       PROJECT VIEW
       ============================================================ */
    .project-view {
      max-width: 780px;
      margin: 0 auto;
      padding: 28px 24px;
    }

    .project-header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 24px;
    }

    .project-header-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: var(--accent-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .project-header-icon svg {
      width: 24px;
      height: 24px;
    }

    .project-header-info { flex: 1; }

    .project-header-name {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .project-header-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .project-stats {
      display: flex;
      gap: 20px;
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .project-stats span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .project-stats svg {
      width: 14px;
      height: 14px;
    }

    .project-section {
      margin-bottom: 28px;
    }

    .project-section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .project-section-title button {
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 500;
    }

    /* ============================================================
       HELP CENTER
       ============================================================ */
    .help-category {
      margin-bottom: 24px;
    }

    .help-category-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .help-article {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .help-article:hover {
      background: var(--surface-secondary);
      color: var(--text-primary);
    }

    .help-article svg {
      width: 15px;
      height: 15px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* ============================================================
       EMPTY STATES
       ============================================================ */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
      color: var(--text-muted);
    }

    .empty-state-icon {
      width: 40px;
      height: 40px;
      margin-bottom: 14px;
      opacity: 0.4;
    }

    .empty-state-title {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .empty-state-desc {
      font-size: 13px;
      max-width: 280px;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    /* ============================================================
       ANIMATIONS
       ============================================================ */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes messageIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes dropdownIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(20px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* ============================================================
       RESPONSIVE
       ============================================================ */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        transform: translateX(-100%);
        box-shadow: var(--shadow-lg);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.35);
        z-index: 39;
        animation: fadeIn 0.2s ease;
      }

      .mobile-menu-btn {
        display: flex;
      }

      .settings-sidebar {
        width: 200px;
        min-width: 200px;
      }

      .settings-content {
        padding: 24px 20px;
      }
    }

    @media (max-width: 640px) {
      .chat-content {
        padding: 16px 14px 110px;
      }

      .composer-wrap {
        padding: 0 10px 12px;
      }

      .suggestions-grid {
        grid-template-columns: 1fr;
      }

      .welcome-title {
        font-size: 22px;
      }

      .topbar-title {
        max-width: 140px;
      }

      .topbar-center {
        display: none;
      }

      .settings-sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
        z-index: 90;
      }

      .settings-sidebar.open {
        transform: translateX(0);
      }

      .settings-content {
        padding: 20px 16px;
        margin-left: 0;
      }

      .modal {
        max-width: 100%;
        border-radius: var(--radius-md);
      }

      .toast-container {
        left: 16px;
        right: 16px;
        bottom: 16px;
      }

      .toast { max-width: 100%; }

      .message.user .message-content {
        max-width: 88%;
      }

      .auth-card {
        padding: 28px 20px;
      }

      .form-row {
        flex-direction: column;
        gap: 0;
      }
    }

    /* Utility */
    .hidden { display: none !important; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      border: 0;
    }
  </style>
</head>
<body>

<!-- ============================================================
     AUTH SCREEN (shown when not authenticated)
     ============================================================ -->
<div id="authScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="2" width="14" height="14" rx="3" fill="var(--accent)"/>
        <rect x="20" y="2" width="14" height="14" rx="3" fill="var(--accent)" opacity="0.7"/>
        <rect x="2" y="20" width="14" height="14" rx="3" fill="var(--accent)" opacity="0.7"/>
        <rect x="20" y="20" width="14" height="14" rx="3" fill="var(--accent)" opacity="0.4"/>
      </svg>
      <span class="auth-logo-text">SquareAI</span>
    </div>
    <div id="authContent"></div>
  </div>
</div>

<!-- ============================================================
     MAIN APP
     ============================================================ -->
<div id="app" class="app hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
    <div class="sidebar-header">
      <div class="logo-mark">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="13" height="13" rx="3" fill="var(--accent)"/>
          <rect x="18" y="1" width="13" height="13" rx="3" fill="var(--accent)" opacity="0.7"/>
          <rect x="1" y="18" width="13" height="13" rx="3" fill="var(--accent)" opacity="0.7"/>
          <rect x="18" y="18" width="13" height="13" rx="3" fill="var(--accent)" opacity="0.4"/>
        </svg>
      </div>
      <span class="logo-text sidebar-label">SquareAI</span>
      <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" aria-label="Collapse sidebar" style="margin-left:auto;width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text-muted);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
      </button>
    </div>

    <button class="new-chat-btn" id="newChatBtn" aria-label="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      <span class="new-chat-text">New Chat</span>
    </button>

    <button class="sidebar-search-btn" id="searchBtn" aria-label="Search conversations">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span class="sidebar-label">Search</span>
      <kbd>⌘K</kbd>
    </button>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Projects section -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">
          <span>Projects</span>
          <button id="newProjectBtn" aria-label="New project" title="New project">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <div id="projectsList"></div>
      </div>

      <!-- Recent conversations -->
      <div class="sidebar-section">
        <div class="sidebar-section-title">
          <span>Recent</span>
        </div>
        <div id="recentList"></div>
      </div>

      <!-- Starred -->
      <div class="sidebar-section" id="starredSection">
        <div class="sidebar-section-title"><span>Starred</span></div>
        <div id="starredList"></div>
      </div>

      <!-- Archived -->
      <div class="sidebar-section" id="archivedSection">
        <div class="sidebar-section-title"><span>Archived</span></div>
        <div id="archivedList"></div>
      </div>
    </nav>

    <div class="sidebar-footer">
      <button class="sidebar-footer-btn" id="settingsBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
        <span class="sidebar-label">Settings</span>
      </button>
      <button class="user-avatar-btn" id="userMenuBtn" aria-label="User menu">
        <div class="user-avatar" id="sidebarAvatar">SA</div>
        <div class="user-info sidebar-label">
          <div class="user-name" id="sidebarUserName">Alex Rivera</div>
          <div class="user-plan">Free plan</div>
        </div>
      </button>
      <button class="sidebar-footer-btn" id="signOutBtn" aria-label="Sign out">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="sidebar-label">Sign out</span>
      </button>
    </div>
  </aside>

  <!-- MAIN AREA -->
  <main class="main" role="main">
    <header class="topbar">
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">New chat</div>
      <div class="topbar-center">
        <button class="model-selector-btn" id="modelSelectorBtn" aria-label="Select model">
          <span class="model-dot"></span>
          <span id="modelSelectorLabel">SquareAI Smart</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
      <div class="topbar-right">
        <button class="topbar-btn" id="shareBtn" aria-label="Share conversation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        </button>
        <button class="topbar-btn" id="moreMenuBtn" aria-label="More options">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
        <div class="topbar-avatar" id="topbarAvatar">SA</div>
      </div>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="chat-content" id="chatContent"></div>
    </div>

    <div class="composer-wrap" id="composerWrap">
      <div class="composer" id="composer">
        <div class="composer-attachments" id="composerAttachments"></div>
        <div class="composer-inner">
          <textarea class="composer-textarea" id="composerTextarea" rows="1" placeholder="Message SquareAI..." aria-label="Message input"></textarea>
          <div class="composer-actions">
            <button class="composer-btn" id="attachBtn" aria-label="Attach file" title="Attach file">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <button class="composer-btn" id="imageBtn" aria-label="Attach image" title="Attach image">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            </button>
            <button class="composer-btn" id="micBtn" aria-label="Voice input" title="Voice input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            </button>
            <button class="send-btn" id="sendBtn" disabled aria-label="Send message">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>

      let buffer = '';
      let answer = '';

// ================================================================
function openModal({ title, body, footer, wide, narrow, onClose }) {
  const root = $('#modalRoot');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');

  const modalClass = wide ? 'wide' : narrow ? 'narrow' : '';
  overlay.innerHTML = `
    <div class="modal ${modalClass}">
      <div class="modal-header">
        <div class="modal-title">${escapeHtml(title)}</div>
        <button class="modal-close" aria-label="Close modal">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body">${body}</div>
      ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
    </div>
  `;

  root.appendChild(overlay);

  const close = () => {
    overlay.style.opacity = '0';
    setTimeout(() => {
      overlay.remove();
      if (onClose) onClose();
    }, 180);
  };

  overlay.querySelector('.modal-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => {
    if (e.target === overlay) close();
  });

  const escHandler = (e) => {
    if (e.key === 'Escape') {
      close();
      document.removeEventListener('keydown', escHandler);
    }
  };
  document.addEventListener('keydown', escHandler);

  // Focus first input
  setTimeout(() => {
    const firstInput = overlay.querySelector('input, textarea, button:not(.modal-close)');
    if (firstInput) firstInput.focus();
  }, 100);

  return { overlay, close };
}

  if (activeProjects.length === 0) {
    projectsList.innerHTML = `<div class="empty-sidebar">No projects yet</div>`;
  } else {
    projectsList.innerHTML = activeProjects.map(p => `

        <div class="project-item-icon">

        </div>
        <div class="project-item-text">${escapeHtml(p.name)}</div>
      </div>
    `).join('');
  }

  // Recent conversations (not archived, not starred)
  const recent = State.conversations
    .filter(c => !c.archived && !c.starred)
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .slice(0, 20);

  const recentList = $('#recentList');
  if (recent.length === 0) {
    recentList.innerHTML = `<div class="empty-sidebar">No conversations yet</div>`;
  } else {
    // Group by date
    const groups = {};
    recent.forEach(c => {
      const label = formatDate(c.updatedAt);
      if (!groups[label]) groups[label] = [];
      groups[label].push(c);
    });
    let html = '';
    Object.entries(groups).forEach(([label, convs]) => {
      html += convs.map(c => convItemHTML(c)).join('');
    });
    recentList.innerHTML = html;
  }

  // Starred
  const starred = State.conversations.filter(c => c.starred && !c.archived);
  const starredList = $('#starredList');
  if (starred.length === 0) {
    starredList.innerHTML = `<div class="empty-sidebar">No starred chats</div>`;
  } else {
    starredList.innerHTML = starred.map(c => convItemHTML(c)).join('');
  }

  // Archived
  const archived = State.conversations.filter(c => c.archived);
  const archivedList = $('#archivedList');
  if (archived.length === 0) {
    archivedList.innerHTML = `<div class="empty-sidebar">No archived chats</div>`;
  } else {
    archivedList.innerHTML = archived.map(c => convItemHTML(c)).join('');
  }

  // User
  if (State.user) {
    $('#sidebarUserName').textContent = State.user.name;
    $('#sidebarAvatar').textContent = Auth.getInitials(State.user.name);
    $('#topbarAvatar').textContent = Auth.getInitials(State.user.name);
  }
}

}

function getActiveConversation() {
  return State.conversations.find(c => c.id === State.activeConversationId) || null;
}

function createConversation() {
  const conv = {
    id: generateId('conv_'),
    title: 'New chat',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    starred: false,
    archived: false,
    messages: []
  };
  State.conversations.unshift(conv);
  State.activeConversationId = conv.id;
  saveConversations();
  renderSidebar();
  renderChat();
  focusInput();
  return conv;
}

function saveConversations() {
  DB.save(conversationStorageKey(), State.conversations);
  if (!supabaseClient || !State.user) return;
  conversationSync = conversationSync.then(async () => {
    for (const conversation of State.conversations) {
      if (!conversation.remoteId) {
        const { data, error } = await supabaseClient.from('chat_sessions')
          .insert({ user_id: State.user.id, title: conversation.title, model: MODELS[State.model]?.provider || 'gemini' })
          .select('id').single();
        if (error) throw error;
        conversation.remoteId = data.id;
      }
      for (const message of conversation.messages) {
        if (message.dbId && message.persistedContent === message.content) continue;
        if (message.dbId) {
          const { error } = await supabaseClient.from('chat_messages')
            .update({ content: message.content }).eq('id', message.dbId);
          if (error) throw error;
        } else {
          const { data, error } = await supabaseClient.from('chat_messages')
            .insert({
              session_id: conversation.remoteId,
              user_id: State.user.id,
              role: message.role === 'assistant' ? 'assistant' : 'user',
              content: message.content,
              model: MODELS[State.model]?.provider || 'gemini'
            })
            .select('id').single();
          if (error) throw error;
          message.dbId = data.id;
        }
        message.persistedContent = message.content;
      }
      await supabaseClient.from('chat_sessions')
        .update({ title: conversation.title, updated_at: new Date().toISOString() })
        .eq('id', conversation.remoteId);
    }
  }).catch(error => {
    console.error('Conversation sync failed:', error);
    showToast(error.message || 'Could not save this conversation.', 'error');
  });
}

let conversationSync = Promise.resolve();

function conversationStorageKey() {
  return State.user ? `${DB.keys.conversations}_${State.user.id}` : DB.keys.conversations;
}

async function loadConversationsFromDB() {
  if (!supabaseClient || !State.user) return;
  const { data: sessions, error } = await supabaseClient.from('chat_sessions')
    .select('id, title, created_at, updated_at')
    .order('updated_at', { ascending: false });
  if (error) throw error;
  const rows = sessions?.length
    ? await supabaseClient.from('chat_messages')
      .select('id, session_id, role, content, created_at')
      .in('session_id', sessions.map(session => session.id))
      .order('created_at', { ascending: true })
    : { data: [] };
  if (rows.error) throw rows.error;

  State.conversations = (sessions || []).map(session => ({
    id: session.id,
    remoteId: session.id,
    title: session.title,
    createdAt: new Date(session.created_at).getTime(),
    updatedAt: new Date(session.updated_at).getTime(),
    starred: false,
    archived: false,
    messages: (rows.data || []).filter(message => message.session_id === session.id).map(message => ({
      id: message.id,
      dbId: message.id,
      persistedContent: message.content,
      role: message.role,
      content: message.content,
      timestamp: new Date(message.created_at).getTime(),
      attachments: []
    }))
  }));
  if (!State.conversations.length) State.activeConversationId = null;
  else State.activeConversationId = State.conversations[0].id;
  DB.save(conversationStorageKey(), State.conversations);
  renderSidebar();
  renderChat();
}

function addMessage(role, content, attachments = []) {
  let conv = getActiveConversation();
  if (!conv) conv = createConversation();

  const msg = {
    id: generateId('msg_'),
    role,
    content,
    timestamp: Date.now(),
    attachments
  };
  conv.messages.push(msg);
  conv.updatedAt = Date.now();

  // Auto-title from first user message
  if (role === 'user' && conv.title === 'New chat') {
    conv.title = generateTitle(content);
  }

  if (State.settings.autoSave) saveConversations();
  renderSidebar();
  renderChat();
  return msg;
}

function generateTitle(text) {
  let t = text.trim().replace(/[?!.]+$/, '');
  // Remove common lead-ins
  t = t.replace(/^(can you|could you|please|help me|i want to|i need to|how do i|how to|what is|explain)\s+/i, '');
  // Capitalize first letter
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (t.length > 48) t = t.slice(0, 48).trim() + '…';
  return t || 'New chat';
}

async function sendMessage() {
  const textarea = $('#composerTextarea');
  const text = textarea.value.trim();
  const attachments = [...State.attachments];
  if (!text && attachments.length === 0) return;

  // Capture attachments before clearing
  const attachmentMeta = attachments.map(a => ({
    id: a.id,
    name: a.name,
    size: a.size,
    type: a.type,
    isImage: a.isImage,
    dataUrl: a.dataUrl || null
  }));

  // Clear input
  textarea.value = '';
  State.attachments = [];
  renderAttachments();
  updateSendButton();
  autoResizeTextarea();

  // Add user message
  addMessage('user', text, attachmentMeta);
  scrollToBottom();

  // Show typing indicator
  const conv = getActiveConversation();
  const typingId = 'typing_' + Date.now();
  const content = $('#chatContent');
  const typingEl = document.createElement('div');
  typingEl.id = typingId;
  typingEl.className = 'message assistant';
  typingEl.innerHTML = `
    <div class="message-avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
        <rect x="2" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.9"/>
        <rect x="14" y="2" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="2" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.6"/>
        <rect x="14" y="14" width="8" height="8" rx="2" fill="currentColor" opacity="0.3"/>
      </svg>
    </div>
    <div class="message-body">
      <div class="typing-indicator">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>
  `;
  content.appendChild(typingEl);
  scrollToBottom();

  // Generate AI response
  State.generationAbort = false;
  try {
    const response = await AIEngine.generate(
      conv.messages.map(message => ({
        role: message.role === 'assistant' ? 'assistant' : 'user',
        content: message.content
      })),
      partial => {
        const body = typingEl.querySelector('.message-body');
        if (body) body.innerHTML = `<div class="message-content">${renderAssistantContent(partial)}</div>`;
        scrollToBottom();
      }
    );

    // Remove typing indicator
    typingEl.remove();

    // Add assistant message
    const msg = addMessage('assistant', response);
    scrollToBottom();
  } catch (e) {
    typingEl.remove();
    showToast(e.message || 'AI is temporarily unavailable. Please try again.', 'error');
  }
}
